services:
  # --------------------------------------------------------------------
  # Kalshi Perps -- the ORIGINAL, still-live service. Its name is left
  # UNCHANGED on purpose: Render's Blueprint sync matches services by
  # `name`, and this one already has a real public URL
  # (bettor-00di.onrender.com) that real money / the Kalshi OAuth-adjacent
  # config depends on.
  #
  # NOTE: Render's ACTUAL Start Command for this specific service is set
  # manually in the Render dashboard (`gunicorn app:app`), independent of
  # this file -- confirmed live when a rename briefly broke that exact
  # module and this startCommand here did NOT protect against it. All the
  # real logic lives in app_kalshi.py (repo root); app.py is a one-line
  # shim re-exporting it under the name the dashboard's Start Command
  # expects. This file's startCommand is kept correct/equivalent for when
  # that manual override is eventually cleared, and for anyone who forks
  # this repo onto a fresh Render Blueprint deploy.
  # --------------------------------------------------------------------
  - type: web
    name: bettor-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --workers 1 is deliberate: this app runs its own in-process background
    # scheduler (APScheduler) for the perps data-collect / train / trading
    # cycles. Running more than one worker means every scheduled job --
    # including live Kalshi order placement -- fires once per worker,
    # independently and concurrently, which risks duplicate orders. Do not
    # raise this without adding proper cross-worker coordination first.
    # --timeout 60 (gunicorn default is 30s): a slow Kalshi API response on
    # /api/status used to be able to exceed the default and get the single
    # worker killed + restarted by gunicorn's arbiter, which re-ran the
    # whole startup sequence (scheduler rebuilt from scratch) and showed up
    # as the dashboard "losing everything" every so often. Caching in
    # app_kalshi.py fixes the underlying slowness; this is defense-in-depth.
    startCommand: gunicorn app_kalshi:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 60
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Pinned here (not left to manual dashboard config) after this service
      # ran for a while still pointed at an old repo from before this project
      # became perps-only -- Render's Blueprint sync keeps these enforced on
      # every deploy instead of depending on someone clicking through the
      # dashboard correctly. Secrets (KALSHI_API_KEY, KALSHI_PRIVATE_KEY,
      # HF_API_KEY, KALSHI_PERPS_LIVE_TRADING_ENABLED, ...) stay manually set
      # in the Render dashboard's Environment tab -- never put secrets or the
      # live-trading toggle in a git-tracked file.
      - key: HF_DATASET_REPO
        value: papylove/kalshi-perps-data
      - key: HF_MODEL_REPO
        value: papylove/kalshi-perps-model
      # Bidirectional (long+short) trading. Backtested twice on the fixed
      # (simulation-clock-corrected) engine, on two different archive sizes --
      # both times bidirectional beat long-only by a wide margin (+37.9% vs
      # +14.2% return on the most recent run) at a comparable win rate, so
      # this graduated from dry-run-only to the deployed default.
      - key: PERPS_ENABLE_SHORTS
        value: "1"
      # Cross-link to the Alpaca service's dashboard, shown as a nav link
      # on this one. Render doesn't expose a way to reference ANOTHER
      # service's public URL from within a blueprint, so this has to be
      # filled in manually (Render dashboard -> this service -> Environment)
      # once the Alpaca service's real onrender.com URL is known. Left
      # unset here (falls back to a dead "#" link) rather than guessed at.
      - key: ALPACA_SERVER_URL
        sync: false

  # --------------------------------------------------------------------
  # Alpaca stocks -- replaced the former Charles Schwab integration (which
  # never completed its interactive OAuth login and never traded) with a
  # paper-trading Alpaca account: simple API-key/secret auth instead of
  # OAuth, real market data, same long-only scalper strategy shape. Kept
  # as a deliberately separate service from bettor-dashboard above: its
  # own process, own gunicorn worker, own APScheduler, own public URL --
  # what makes the two bots genuinely independent servers rather than
  # routes sharing one process (a crash, OOM, or redeploy on one side can
  # no longer take the other down with it).
  #
  # NOTE: this service's Render `name` is still `bettor-schwab` -- Render
  # does not support renaming a service's name/slug after creation (see
  # the comment on bettor-dashboard above re: Blueprint sync matching by
  # `name`; changing it here would create a brand-new service rather than
  # updating this one). The service's actual startCommand/env vars below
  # are fully Alpaca now; only this cosmetic Render-side identifier is a
  # legacy leftover.
  # --------------------------------------------------------------------
  - type: web
    name: bettor-schwab
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Same single-worker reasoning as bettor-dashboard: this process places
    # real Alpaca orders via its own in-process scheduler, so more than one
    # worker would mean duplicate order placement.
    startCommand: gunicorn --chdir src alpaca_server:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 60
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HF_ALPACA_DATASET_REPO
        value: papylove/alpaca-data
      - key: HF_ALPACA_MODEL_REPO
        value: papylove/alpaca-model
      # Cross-link to the Perps service's dashboard (nav link the other
      # direction). Same manual-fill caveat as ALPACA_SERVER_URL above --
      # bettor-dashboard's URL is already known (bettor-00di.onrender.com)
      # so this can actually be set right away.
      - key: PERPS_SERVER_URL
        sync: false
      # Secrets (ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY, HF_API_KEY,
      # ALPACA_LIVE_TRADING_ENABLED, ...) stay manually set in the Render
      # dashboard's Environment tab -- never put secrets or the
      # live-trading toggle in a git-tracked file. Unlike Schwab, Alpaca
      # needs no OAuth callback URL -- a static key/secret pair is the
      # whole auth story, so there's no equivalent of SCHWAB_REDIRECT_URI
      # to keep in sync with a developer-portal app registration.
