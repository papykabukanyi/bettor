services:
  # --------------------------------------------------------------------
  # Kalshi Perps -- the ORIGINAL, still-live service. Its name is left
  # UNCHANGED on purpose: Render's Blueprint sync matches services by
  # `name`, and this one already has a real public URL
  # (bettor-00di.onrender.com) that real money / the Kalshi OAuth-adjacent
  # config depends on.
  #
  # NOTE: Render's ACTUAL Start Command for this specific service is set
  # manually in the Render dashboard (`gunicorn app:app`), independent of
  # this file -- confirmed live when a rename briefly broke that exact
  # module and this startCommand here did NOT protect against it. All the
  # real logic lives in app_kalshi.py (repo root); app.py is a one-line
  # shim re-exporting it under the name the dashboard's Start Command
  # expects. This file's startCommand is kept correct/equivalent for when
  # that manual override is eventually cleared, and for anyone who forks
  # this repo onto a fresh Render Blueprint deploy.
  # --------------------------------------------------------------------
  - type: web
    name: bettor-dashboard
    env: python
    plan: standard  # migrated off the 512Mi free tier to a paid 2GB standard plan (new Render account)
    buildCommand: pip install -r requirements.txt
    # --workers 1 is deliberate: this app runs its own in-process background
    # scheduler (APScheduler) for the perps data-collect / train / trading
    # cycles. Running more than one worker means every scheduled job --
    # including live Kalshi order placement -- fires once per worker,
    # independently and concurrently, which risks duplicate orders. Do not
    # raise this without adding proper cross-worker coordination first.
    # --timeout 300 (gunicorn default is 30s): a slow Kalshi API response on
    # /api/status used to be able to exceed a short default and get the
    # single worker killed + restarted by gunicorn's arbiter, which re-ran
    # the whole startup sequence (scheduler rebuilt from scratch) and
    # showed up as the dashboard "losing everything" every so often.
    # Confirmed live this window: the manual /api/perps/train endpoint's
    # walk-forward-CV + calibration training run (perps_model.py) itself
    # can take well over 2 minutes on Render's shared CPU (a local profile
    # of ~50s scaled by the already-known 4-8x shared-CPU slowdown), so 60s
    # wasn't even enough on its own -- raised to 300s to give a manual
    # retrain real headroom to finish over HTTP. The scheduled daily cron
    # call to the same function is unaffected either way since it runs
    # in-process, never through gunicorn's per-request timeout at all.
    startCommand: gunicorn app_kalshi:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 300
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Pinned here (not left to manual dashboard config) after this service
      # ran for a while still pointed at an old repo from before this project
      # became perps-only -- Render's Blueprint sync keeps these enforced on
      # every deploy instead of depending on someone clicking through the
      # dashboard correctly. Secrets (KALSHI_API_KEY, KALSHI_PRIVATE_KEY,
      # HF_API_KEY, KALSHI_PERPS_LIVE_TRADING_ENABLED, ...) stay manually set
      # in the Render dashboard's Environment tab -- never put secrets or the
      # live-trading toggle in a git-tracked file.
      - key: HF_DATASET_REPO
        value: papylove/kalshi-perps-data
      - key: HF_MODEL_REPO
        value: papylove/kalshi-perps-model
      # Bidirectional (long+short) trading. Backtested twice on the fixed
      # (simulation-clock-corrected) engine, on two different archive sizes --
      # both times bidirectional beat long-only by a wide margin (+37.9% vs
      # +14.2% return on the most recent run) at a comparable win rate, so
      # this graduated from dry-run-only to the deployed default.
      - key: PERPS_ENABLE_SHORTS
        value: "1"
      # Chart-study confidence layer (see crypto_correlation.py's own
      # module docstring): correlation-derived + multi-timeframe-confluence
      # studies, ADDITIVE on top of the existing technical+model gate above
      # -- never a new, independent way to enter, only a capped nudge
      # (+/-PERPS_CORRELATION_CONFIDENCE_MAX_ADJUSTMENT, default 0.06) to
      # the SAME confidence bar that gate already enforces, plus an
      # evidence-gated early-exit/extension signal decide_exit already
      # applies to momentum/breakout/sentiment. Graduated to the deployed
      # default per explicit user direction -- correctness is covered by
      # 30+ unit tests and leakage-free backtest wiring
      # (perps_backtest.run_backtest(use_correlation_study=True)), but
      # unlike PERPS_ENABLE_SHORTS above this has NOT yet been validated by
      # an actual historical-return backtest RUN; the evidence-gated
      # tuner (recommend_correlation_study_weight, see
      # perps_trade_analysis.py) watches real closed trades from here on
      # and will scale this back down -- or disable it outright -- the
      # moment real P&L shows it isn't helping.
      - key: PERPS_USE_CORRELATION_STUDY
        value: "1"
      # Conviction-scaled entry sizing, scale-in, and partial-exit
      # (perps_strategy.py) all default OFF here. Briefly turned ON as a
      # manual pick, then reverted: two independent backtest sweeps (40
      # configs/14 days, then 150 configs/30 days, both with real
      # multi-fold walk-forward confirmation -- see perps_sweep.py) found
      # NO combination of these 3 features beating the baseline in recent
      # history -- every finalist showed 0% profitable walk-forward folds.
      # Consistent with this file's own long-documented thin/negative edge
      # even before these features existed. Left off pending the live
      # evidence-gated forward-tuner (perps_trade_analysis.py) actually
      # trialing one with real, ongoing trade data rather than a manual
      # pick or a backtest sample that's inherently capped at ~30-44 days.
      - key: PERPS_USE_CONVICTION_SIZING
        value: "0"
      # Cross-links to the Alpaca services' dashboards, shown as nav links
      # on this one. Render doesn't expose a way to reference ANOTHER
      # service's public URL from within a blueprint, so these have to be
      # filled in manually (Render dashboard -> this service -> Environment)
      # once each Alpaca service's real onrender.com URL is known. Left
      # unset here (falls back to a dead "#" link) rather than guessed at.
      - key: ALPACA_SERVER_URL
        sync: false
      - key: ALPACA_CRYPTO_SERVER_URL
        sync: false
      - key: ALPACA_OPTIONS_SERVER_URL
        sync: false

  # --------------------------------------------------------------------
  # Alpaca stocks -- replaced the former Charles Schwab integration (which
  # never completed its interactive OAuth login and never traded) with a
  # paper-trading Alpaca account: simple API-key/secret auth instead of
  # OAuth, real market data, same long-only scalper strategy shape. Kept
  # as a deliberately separate service from bettor-dashboard above: its
  # own process, own gunicorn worker, own APScheduler, own public URL --
  # what makes the two bots genuinely independent servers rather than
  # routes sharing one process (a crash, OOM, or redeploy on one side can
  # no longer take the other down with it).
  #
  # NOTE: this service's Render `name` is still `bettor-schwab` -- Render
  # does not support renaming a service's name/slug after creation (see
  # the comment on bettor-dashboard above re: Blueprint sync matching by
  # `name`; changing it here would create a brand-new service rather than
  # updating this one). The service's actual startCommand/env vars below
  # are fully Alpaca now; only this cosmetic Render-side identifier is a
  # legacy leftover.
  # --------------------------------------------------------------------
  - type: web
    name: bettor-schwab
    env: python
    plan: standard  # migrated off the 512Mi free tier to a paid 2GB standard plan (new Render account)
    buildCommand: pip install -r requirements.txt
    # Same single-worker reasoning as bettor-dashboard: this process places
    # real Alpaca orders via its own in-process scheduler, so more than one
    # worker would mean duplicate order placement.
    # --timeout 300 (was 60): real, confirmed incident -- the manual
    # /api/alpaca/train and /api/alpaca/train_torch routes call
    # load_training_dataset(), which can legitimately take longer than 60s
    # (up to 90 sequential HF shard downloads) even without a hang; a slow
    # call tripped gunicorn's own WORKER TIMEOUT and SIGABRT-killed the
    # worker, taking the background APScheduler thread down with it. Same
    # --timeout app_kalshi.py already uses for its own analogous slow-call risk.
    startCommand: gunicorn --chdir src alpaca_server:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 300
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HF_ALPACA_DATASET_REPO
        value: papylove/alpaca-data
      - key: HF_ALPACA_MODEL_REPO
        value: papylove/alpaca-model
      # Cross-links to the Perps and Alpaca-crypto services' dashboards
      # (nav links). Same manual-fill caveat as above -- bettor-dashboard's
      # URL is already known (bettor-00di.onrender.com) so that one can be
      # set right away; the crypto service's URL isn't known until it's
      # deployed.
      - key: PERPS_SERVER_URL
        sync: false
      - key: ALPACA_CRYPTO_SERVER_URL
        sync: false
      - key: ALPACA_OPTIONS_SERVER_URL
        sync: false
      # Secrets (ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY, HF_API_KEY,
      # ALPACA_LIVE_TRADING_ENABLED, ...) stay manually set in the Render
      # dashboard's Environment tab -- never put secrets or the
      # live-trading toggle in a git-tracked file. Unlike Schwab, Alpaca
      # needs no OAuth callback URL -- a static key/secret pair is the
      # whole auth story, so there's no equivalent of SCHWAB_REDIRECT_URI
      # to keep in sync with a developer-portal app registration.

  # --------------------------------------------------------------------
  # Alpaca CRYPTO -- split out into its own service after a real, confirmed
  # OOM crash loop from running it in the SAME process as the equities
  # strategy on a 512MB plan (Render's own event log showed oomKilled
  # restarts within seconds of every boot). Same Alpaca account/
  # credentials as bettor-schwab above, own process/worker/scheduler/
  # public URL -- the exact reasoning that already justified splitting
  # perps from equities, just applied one asset class later. See
  # src/alpaca_crypto_server.py's own docstring for the full incident.
  # --------------------------------------------------------------------
  - type: web
    name: bettor-alpaca-crypto
    env: python
    plan: standard  # migrated off the 512Mi free tier to a paid 2GB standard plan (new Render account)
    buildCommand: pip install -r requirements.txt
    # Same single-worker reasoning as every other service here: this
    # process places real Alpaca crypto orders via its own in-process
    # scheduler, so more than one worker would mean duplicate order
    # placement.
    # --timeout 300 (was 60): same real incident as bettor-schwab's own
    # copy of this comment -- load_training_dataset() can legitimately
    # exceed 60s even without a hang.
    startCommand: gunicorn --chdir src alpaca_crypto_server:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 300
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HF_ALPACA_CRYPTO_DATASET_REPO
        value: papylove/alpaca-crypto-data
      - key: HF_ALPACA_CRYPTO_MODEL_REPO
        value: papylove/alpaca-crypto-model
      # Chart-study confidence layer -- same graduated-default reasoning as
      # PERPS_USE_CORRELATION_STUDY (see that key's own comment in the
      # bettor-dashboard service above): ADDITIVE on top of the existing
      # technical+model gate, never a new independent way to enter, capped
      # nudge only. This service's own recommend_correlation_study_weight
      # (alpaca_crypto_trade_analysis.py) watches real closed trades and
      # will scale it back if it isn't helping.
      - key: ALPACA_CRYPTO_USE_CORRELATION_STUDY
        value: "1"
      # Cross-links to the Perps and Alpaca-stocks services' dashboards.
      - key: PERPS_SERVER_URL
        sync: false
      - key: ALPACA_STOCKS_SERVER_URL
        sync: false
      - key: ALPACA_OPTIONS_SERVER_URL
        sync: false
      # Secrets (ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY, HF_API_KEY,
      # ALPACA_CRYPTO_LIVE_TRADING_ENABLED, ...) stay manually set in the
      # Render dashboard's Environment tab -- SAME Alpaca account/key pair
      # as bettor-schwab (equities), just a different strategy/process.

  # --------------------------------------------------------------------
  # Alpaca OPTIONS (stocks/equity options, buy-only calls/puts) -- its own
  # service from the start, following the exact same "split into separate
  # services" reasoning already forced onto crypto by a real OOM incident:
  # a crash, OOM, or redeploy on one asset class can no longer take any of
  # the others down with it. Same Alpaca account/credentials as
  # bettor-schwab (equities) and bettor-alpaca-crypto -- options trading
  # just needs the account's options trading level enabled. See
  # src/alpaca_options_server.py's own docstring for the full design.
  # --------------------------------------------------------------------
  - type: web
    name: bettor-alpaca-options
    env: python
    plan: standard  # migrated off the 512Mi free tier to a paid 2GB standard plan (new Render account)
    buildCommand: pip install -r requirements.txt
    # Same single-worker reasoning as every other service here: this
    # process places real Alpaca options orders via its own in-process
    # scheduler, so more than one worker would mean duplicate order
    # placement.
    # --timeout 300 (was 60): same real incident as bettor-schwab's own
    # copy of this comment -- load_training_dataset() can legitimately
    # exceed 60s even without a hang.
    startCommand: gunicorn --chdir src alpaca_options_server:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 300
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HF_ALPACA_OPTIONS_DATASET_REPO
        value: papylove/alpaca-options-data
      - key: HF_ALPACA_OPTIONS_MODEL_REPO
        value: papylove/alpaca-options-model
      # Cross-links to the Perps, Alpaca-stocks, and Alpaca-crypto
      # services' dashboards.
      - key: PERPS_SERVER_URL
        sync: false
      - key: ALPACA_STOCKS_SERVER_URL
        sync: false
      - key: ALPACA_CRYPTO_SERVER_URL
        sync: false
      # Secrets (ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY, HF_API_KEY,
      # ALPACA_OPTIONS_LIVE_TRADING_ENABLED, ...) stay manually set in the
      # Render dashboard's Environment tab -- SAME Alpaca account/key pair
      # as bettor-schwab/bettor-alpaca-crypto, just a different strategy/
      # process. Requires the account's options trading level (2+) to be
      # approved on Alpaca's side before ALPACA_OPTIONS_LIVE_TRADING_ENABLED
      # is ever turned on -- simulate mode needs no such approval.
